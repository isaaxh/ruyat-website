<!-- @dsCard group="Forms" height=520 subtitle="Inquiry form with one error" -->
<div class="ra" lang="en" dir="ltr" style="padding:24px;background:var(--surface);max-width:560px">
  <form class="ra-form" onsubmit="return false">
    <div class="ra-form__row ra-form__row--2">
      <div class="ra-field"><label class="ra-field__label" for="n">Full name</label><input class="ra-input" id="n" value="Ahmed Khan"></div>
      <div class="ra-field ra-field--error"><label class="ra-field__label" for="p">Phone</label><input class="ra-input ra-input--latin" id="p" placeholder="+966 5X XXX XXXX" aria-invalid="true" aria-describedby="pm"><p class="ra-field__msg" id="pm"><svg class="ra-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg> Enter a phone number we can reach on WhatsApp.</p></div>
    </div>
    <div class="ra-field"><label class="ra-field__label" for="s">Service</label><div class="ra-select-wrap"><select class="ra-select" id="s"><option>Umrah Visa Processing</option><option>Company Formation</option></select></div></div>
    <div class="ra-field"><label class="ra-field__label" for="m">Message</label><textarea class="ra-textarea" id="m" placeholder="Dates, number of travellers, questions"></textarea><p class="ra-field__hint">Optional</p></div>
    <button class="ra-btn ra-btn--whatsapp ra-btn--block" type="submit"><svg class="ra-ico ra-ico--wa" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1"/></svg>Send on WhatsApp</button>
  </form>
</div>
<script></script>
